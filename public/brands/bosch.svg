<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <!-- Classic Bosch red rectangle -->
  <rect x="25" y="28" width="190" height="44" rx="3" fill="#EA0016"/>

  <!-- White border inside -->
  <rect x="28" y="31" width="184" height="38" rx="2" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- BOSCH text -->
  <text x="120" y="60" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">
    BOSCH
  </text>

  <!-- Tagline -->
  <text x="120" y="90" font-family="Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle" letter-spacing="1">
    Invented for life
  </text>
</svg>
