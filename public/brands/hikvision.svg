<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <defs>
    <linearGradient id="hikGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052CC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066E6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background shape -->
  <rect x="15" y="25" width="210" height="50" rx="4" fill="url(#hikGrad)" opacity="0.1"/>

  <!-- Logo mark - Camera lens inspired -->
  <circle cx="40" cy="50" r="15" fill="none" stroke="url(#hikGrad)" stroke-width="2.5"/>
  <circle cx="40" cy="50" r="8" fill="url(#hikGrad)"/>
  <circle cx="40" cy="50" r="4" fill="white"/>

  <!-- Brand text -->
  <text x="70" y="58" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="url(#hikGrad)" letter-spacing="1">
    HIKVISION
  </text>

  <!-- Accent line -->
  <line x1="70" y1="65" x2="140" y2="65" stroke="url(#hikGrad)" stroke-width="2" opacity="0.6"/>
</svg>
