<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <defs>
    <radialGradient id="cpGrad">
      <stop offset="0%" style="stop-color:#E31E24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C41E3A;stop-opacity:1" />
    </radialGradient>
  </defs>

  <!-- CP Circle -->
  <circle cx="50" cy="50" r="24" fill="url(#cpGrad)"/>
  <circle cx="50" cy="50" r="22" fill="none" stroke="white" stroke-width="1.5"/>

  <!-- CP Text in circle -->
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="white" text-anchor="middle">
    CP
  </text>

  <!-- PLUS Text -->
  <text x="90" y="58" font-family="Arial, sans-serif" font-size="36" font-weight="900" fill="#E31E24" letter-spacing="1">
    PLUS
  </text>

  <!-- Registered mark -->
  <circle cx="195" cy="42" r="6" fill="none" stroke="#E31E24" stroke-width="1"/>
  <text x="195" y="45" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#E31E24" text-anchor="middle">
    R
  </text>
</svg>
