<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <defs>
    <linearGradient id="univGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052A5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main container -->
  <rect x="30" y="30" width="180" height="40" rx="5" fill="url(#univGrad)"/>

  <!-- UNV large text -->
  <text x="120" y="62" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="white" text-anchor="middle" letter-spacing="4">
    UNV
  </text>

  <!-- Uniview small -->
  <text x="120" y="85" font-family="Arial, sans-serif" font-size="10" fill="#666" text-anchor="middle" letter-spacing="1">
    UNIVIEW
  </text>
</svg>
