<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <defs>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#EC1C24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D71920;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Red circle logo mark -->
  <circle cx="45" cy="50" r="18" fill="url(#honeyGrad)"/>
  <circle cx="45" cy="50" r="14" fill="none" stroke="white" stroke-width="2"/>

  <!-- H in circle -->
  <text x="45" y="58" font-family="Arial, sans-serif" font-size="18" font-weight="900" fill="white" text-anchor="middle">
    H
  </text>

  <!-- Brand text -->
  <text x="80" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#2B2B2B" letter-spacing="0.5">
    Honeywell
  </text>
</svg>
